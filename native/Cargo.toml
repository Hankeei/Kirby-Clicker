[package]
name = "kirby-clicker"
version = "1.3.0"
edition = "2024"

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui_extras = { version = "=0.33.3", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
sha2 = "0.10"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-mp3"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Storage_FileSystem"] }

[[bin]]
name = "KirbyClicker"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
